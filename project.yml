name: Corvin
options:
  bundleIdPrefix: com.corvin
  deploymentTarget:
    macOS: "11.0"
    iOS: "16.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    MARKETING_VERSION: "1.3.1"
    CURRENT_PROJECT_VERSION: "1"

    # --- Picture-in-Picture keep-alive (iOS) ---
    # The single switch. NO compiles PiPService down to a no-op stub; YES brings
    # the real layer back for the next release. Nothing else needs editing.
    #
    # App Store builds ship with NO: a PiP window that shows only a placeholder
    # image, kept on screen so the process is not suspended, is what App Review
    # reads as a background-mode workaround (2.5.4) and a hidden feature (2.3.1).
    # The silent-audio layer in BackgroundKeepAliveService holds the process by
    # itself — verified on device across 44 minutes in the background.
    CORVIN_PIP_KEEPALIVE: NO
    # Indirection so one YES/NO above drives the compilation condition; Xcode has
    # no way to branch a setting on another setting's value directly.
    CORVIN_PIP_FLAG_YES: PIP_KEEPALIVE
    CORVIN_PIP_FLAG_NO: ""
  configs:
    # Spelled out per config rather than using $(inherited): at project level
    # there is nothing to inherit from, so DEBUG would silently disappear.
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG $(CORVIN_PIP_FLAG_$(CORVIN_PIP_KEEPALIVE))"
    Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(CORVIN_PIP_FLAG_$(CORVIN_PIP_KEEPALIVE))"

packages:
  KeyboardKit:
    url: https://github.com/KeyboardKit/KeyboardKit
    from: "10.4.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"

targets:
  # --- macOS App ---
  Corvin:
    type: application
    platform: macOS
    sources:
      - path: Shared
      - path: macOS
        excludes:
          - "**/*.md"
          - "**/*.h"
    resources:
      - path: macOS/Resources
        excludes:
          - "*.entitlements"
      - path: Shared/Resources
        excludes:
          - "**/*.swift"
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.corvinvoice.ios
        INFOPLIST_FILE: macOS/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: macOS/Resources/Corvin.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: macOS/Bridge/whisper-bridge.h
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/vendor/whisper.cpp/include"
          - "$(SRCROOT)/vendor/whisper.cpp/ggml/include"
          - "$(SRCROOT)/vendor/opus-build/macos-universal/include"
          - "$(SRCROOT)/vendor/opus-build/macos-universal/include/opus"
        LIBRARY_SEARCH_PATHS:
          - "$(SRCROOT)/vendor/whisper.cpp/build-universal"
          - "$(SRCROOT)/vendor/opus-build/macos-universal/lib"
        OTHER_LDFLAGS: "-lwhisper -lggml -lggml-base -lggml-cpu -lggml-metal -lggml-blas -lopusfile -lopus -logg -lc++ -framework Accelerate -framework Metal -framework MetalKit"
        ENABLE_HARDENED_RUNTIME: YES
        MACOSX_DEPLOYMENT_TARGET: "11.0"
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/Sources/CWhisper/include $(SRCROOT)/Sources/COpus/include"

  # --- iOS App ---
  CorviniOS:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: iOS
        excludes:
          - "**/*.md"
    resources:
      - path: iOS/Resources
        excludes:
          - "*.entitlements"
      - path: Shared/Resources
        excludes:
          - "**/*.swift"
    dependencies:
      - target: CorvinKeyboard
    postBuildScripts:
      - name: Embed KeyboardKit frameworks into host app
        script: |
          set -euo pipefail
          DEST="${TARGET_BUILD_DIR}/${PRODUCT_NAME}.app/Frameworks"
          mkdir -p "$DEST"
          for FW in KeyboardKit.framework LicenseKit.framework; do
            SRC="${BUILT_PRODUCTS_DIR}/${FW}"
            if [ -d "$SRC" ]; then
              echo "Embedding $FW from $SRC"
              rsync -a --delete "$SRC" "$DEST/"
              if [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ] && [ "${EXPANDED_CODE_SIGN_IDENTITY}" != "-" ]; then
                /usr/bin/codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY}" --preserve-metadata=identifier,entitlements,flags --timestamp=none "$DEST/$FW"
              elif [ "${CODE_SIGN_IDENTITY:-}" = "-" ] || [ -z "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
                /usr/bin/codesign --force --sign "-" "$DEST/$FW"
              fi
            else
              echo "warning: framework not found at $SRC"
            fi
          done
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.corvinvoice.ios
        INFOPLIST_FILE: iOS/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: iOS/Resources/Corvin.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        TARGETED_DEVICE_FAMILY: "1,2"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/vendor/whisper.cpp/include"
          - "$(SRCROOT)/vendor/whisper.cpp/ggml/include"
          - "$(SRCROOT)/vendor/opus-build/ios-universal/include"
          - "$(SRCROOT)/vendor/opus-build/ios-universal/include/opus"
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]":
          - "$(SRCROOT)/vendor/whisper.cpp/build-ios-universal"
          - "$(SRCROOT)/vendor/opus-build/ios-universal/lib"
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]":
          - "$(SRCROOT)/vendor/whisper.cpp/build-ios-sim-universal"
          - "$(SRCROOT)/vendor/opus-build/iossim-universal/lib"
        OTHER_LDFLAGS: "-lwhisper -lggml -lggml-base -lggml-cpu -lggml-metal -lopusfile -lopus -logg -lc++ -framework Accelerate -framework Metal -framework MetalKit"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/Sources/CWhisper/include-ios $(SRCROOT)/Sources/COpus/include-ios"
      configs:
        # Release is the archive/TestFlight path. Sign it manually against a
        # pre-provisioned App Store profile: with automatic signing the default
        # CODE_SIGN_IDENTITY is "Apple Development", so the archive went looking
        # for a development profile and only succeeded by minting a throwaway
        # certificate on every CI run. Debug is untouched and stays automatic.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Corvin iOS App Store CI"

  # --- Keyboard Extension ---
  CorvinKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: CorvinKeyboard
        excludes:
          - "**/*.md"
      - path: Shared/Networking
      - path: Shared/Core/FileLogger.swift
      # Without this the extension has no `String.localized` at all — it is a
      # separate binary, so the host app compiling it does not help.
      - path: Shared/Core/LocalizationManager.swift
    resources:
      # Required-reason API declaration; the extension needs its own copy, the
      # host app's manifest does not cover it.
      - path: CorvinKeyboard/Resources/PrivacyInfo.xcprivacy
      # The extension needs its own catalogue: inside an app extension
      # `Bundle.main` is the appex, so it cannot read the host app's strings.
      # XcodeGen also assigns each path to a single target, so Shared/Resources
      # cannot simply be listed here as well. Only the keys the keyboard renders
      # live in these files.
      - path: CorvinKeyboard/Resources/en.lproj
      - path: CorvinKeyboard/Resources/ru.lproj
      - path: CorvinKeyboard/Resources/es.lproj
    dependencies:
      - package: KeyboardKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.corvinvoice.ios.keyboard
        INFOPLIST_FILE: CorvinKeyboard/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: CorvinKeyboard/Resources/Keyboard.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        APPLICATION_EXTENSION_API_ONLY: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Corvin Keyboard App Store CI"

  # --- UI Tests ---
  CorvinUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UITests
    dependencies:
      - target: CorviniOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.corvinvoice.ios.uitests
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        TEST_HOST: ""
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Corvin:
    build:
      targets:
        Corvin: all
  CorviniOS:
    build:
      targets:
        CorviniOS: all
        CorvinKeyboard: all
    run:
      config: Debug
      executable: CorviniOS
    test:
      config: Debug
      targets:
        - CorvinUITests
